<VirtualHost *:80>
    ServerName portal.example.test
    DocumentRoot /var/www/payment-portal
    <Directory /var/www/payment-portal>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/payment-portal/private>
        Require all denied
    </Directory>
    <Directory /var/www/payment-portal/admin>
        AuthType Basic
        AuthName "Payment Operations"
        AuthUserFile /etc/apache2/payment.htpasswd
        Require valid-user
    </Directory>
    Redirect permanent /old.html /index.html
    ErrorDocument 404 /404.html
    ErrorLog ${APACHE_LOG_DIR}/payment-error.log
    CustomLog ${APACHE_LOG_DIR}/payment-access.log combined
</VirtualHost>
