server {
    listen 8081 default_server;
    server_name portal.example.test;
    root /var/www/payment-portal;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/payment-access.log combined;
    error_log /var/log/nginx/payment-error.log;
    location / { try_files $uri $uri/ =404; }
    location /payment/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /old.html { return 301 /index.html; }
    location /private/ { deny all; }
    location /admin/ {
        auth_basic "Payment Operations";
        auth_basic_user_file /etc/nginx/payment.htpasswd;
    }
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    error_page 404 /404.html;
}
