database = off
declarative_config = /etc/kong-lab/kong.yml
prefix = /var/lib/kong-lab
proxy_listen = 127.0.0.1:8000
admin_listen = 127.0.0.1:8001
nginx_worker_processes = 1
nginx_daemon = on
proxy_access_log = /var/log/kong-lab/access.log
proxy_error_log = /var/log/kong-lab/error.log
admin_access_log = /var/log/kong-lab/admin-access.log
admin_error_log = /var/log/kong-lab/admin-error.log
