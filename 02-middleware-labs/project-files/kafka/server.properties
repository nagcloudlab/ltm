# Kafka 4.4 - one laptop, one node, KRaft mode (no ZooKeeper).
# This node is both the broker (stores messages) and the controller (keeps the cluster metadata).
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093

# 9092 = clients (producers, consumers, CLI tools). 9093 = controller traffic only.
# Bound to loopback: only programs on this laptop can connect (same idea as Tomcat in Day 1).
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Where the partitions (message files) live. The stock file says /tmp/kraft-combined-logs.
log.dirs=/var/lib/kafka
num.partitions=1

# One node, so every internal topic keeps a single copy.
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Keep messages 7 days (168 hours); start a new segment file every 1 GB; check for old segments every 5 minutes.
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
