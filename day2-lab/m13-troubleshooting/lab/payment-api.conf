# /etc/nginx/conf.d/payment-api.conf
map $http_x_request_id $reqid {
    default   $http_x_request_id;
    ""        $request_id;
}
log_format trace '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time rid=$reqid';
server {
    listen 8081;
    access_log /var/log/nginx/payment-access.log trace;
    error_log  /var/log/nginx/payment-error.log;
    location /payment/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Request-ID $reqid;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Request-ID $reqid always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
