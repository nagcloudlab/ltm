# Day 2 Lab 3: HTTPS for portal.example.test on port 443.
# Same portal files and the same /payment/ proxy as the port 8081 site.
server {
    listen 443 ssl;
    server_name portal.example.test;

    # server certificate first, then the intermediate CA (the "chain")
    ssl_certificate     /etc/nginx/ssl/portal-chain.crt;
    ssl_certificate_key /etc/nginx/ssl/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/payment-portal;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/payment-tls-access.log combined;
    error_log  /var/log/nginx/payment-tls-error.log;

    location / { try_files $uri $uri/ =404; }
    location /payment/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
