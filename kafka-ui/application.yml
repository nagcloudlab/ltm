# Kafka UI settings (provectus/kafka-ui v0.7.1)

server:
  port: 8088                      # web page: http://localhost:8088  (8080 is Tomcat's port in the labs)

kafka:
  clusters:
    - name: local                 # name shown in the UI
      bootstrapServers: localhost:9092   # the Kafka broker from Day 2 Lab 2
      readOnly: false             # true = browse only, no create/delete/produce

dynamic:
  config:
    enabled: false                # clusters come only from this file

auth:
  type: DISABLED                  # no login page (classroom only)

logging:
  level:
    root: WARN                    # keep the terminal quiet
    com.provectus: INFO
